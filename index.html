<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 2048 with Sparks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overscroll-behavior: none; 
            touch-action: none; 
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
            perspective: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            transform: translateZ(50px);
        }

        h1 {
            margin: 0;
            font-size: 48px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .score-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .score-board {
            background: #222;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 20px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
            border: 1px solid #333;
            min-width: 100px;
        }

        .score-board span {
            font-size: 24px;
            display: block;
            color: #fff;
        }

        .score-label {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #game-wrapper {
            position: relative;
            transform: rotateX(15deg) rotateZ(0deg);
            transform-style: preserve-3d;
            user-select: none; 
        }

        #grid-container {
            width: 420px;
            height: 420px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 12px;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.9), 
                inset 0 2px 10px rgba(255,255,255,0.05),
                0 0 20px rgba(255,255,255,0.05);
            border: 1px solid #333;
            transform-style: preserve-3d;
        }

        .grid-cell {
            width: 90px;
            height: 90px;
            background: #111;
            border-radius: 8px;
            position: absolute;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
            border: 1px solid #222;
        }

        .tile {
            width: 90px;
            height: 90px;
            position: absolute;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            transform: translateZ(10px);
            transition: top 0.15s ease-in-out, left 0.15s ease-in-out, transform 0.15s;
            box-shadow: 
                0 8px 15px rgba(0,0,0,0.6), 
                inset 0 2px 4px rgba(255,255,255,0.4);
            text-shadow: 1px 2px 4px rgba(0,0,0,0.4);
        }

        .tile-merged {
            animation: pop 0.3s ease-out;
        }
        .tile-new {
            animation: appear 0.3s ease-out;
        }

        @keyframes pop {
            0% { transform: translateZ(10px) scale(1); }
            50% { transform: translateZ(30px) scale(1.15); }
            100% { transform: translateZ(10px) scale(1); }
        }

        @keyframes appear {
            0% { transform: translateZ(0px) scale(0); opacity: 0; }
            100% { transform: translateZ(10px) scale(1); opacity: 1; }
        }

        #sparks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            transform: translateZ(40px);
        }

        /* --- GAME OVER UI STYLES --- */
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            transform: translateZ(60px);
        }

        #game-over-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .bloody-text {
            font-size: 56px;
            color: #ff0000;
            margin: 0 0 30px 0;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 
                2px 2px 0px #660000, 
                -2px -2px 0px #660000,
                0 0 20px #ff0000,
                0 15px 10px rgba(255, 0, 0, 0.9),
                0 25px 25px rgba(255, 0, 0, 0.7);
            animation: pulse-blood 1.5s infinite alternate;
        }

        @keyframes pulse-blood {
            from { 
                text-shadow: 0 0 10px #ff0000, 0 15px 10px rgba(255, 0, 0, 0.9); 
                transform: scale(1); 
            }
            to { 
                text-shadow: 0 0 30px #ff0000, 0 25px 25px rgba(255, 0, 0, 0.7); 
                transform: scale(1.08); 
            }
        }

        #restart-btn {
            background: #8a0000;
            color: white;
            border: 1px solid #ff0000;
            padding: 15px 35px;
            font-size: 22px;
            font-family: 'Poppins', sans-serif;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.2);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: auto;
        }

        #restart-btn:hover {
            background: #ff0000;
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(255,0,0,0.8);
        }

        /* --- VIRTUAL JOYSTICK --- */
        #joystick-container {
            margin-top: 30px;
            transform: translateZ(50px);
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; 
            padding: 20px;
        }

        #joystick-base {
            width: 140px;
            height: 140px;
            background: #111;
            border-radius: 50%;
            position: relative;
            box-shadow: 
                inset 0 10px 25px rgba(0,0,0,1),
                inset 0 -2px 5px rgba(255,255,255,0.1),
                0 5px 15px rgba(0,0,0,0.6);
            border: 2px solid #222;
            cursor: grab;
        }

        #joystick-base:active {
            cursor: grabbing;
        }

        #joystick-stick {
            width: 64px;
            height: 64px;
            background: radial-gradient(circle at 30% 30%, #555, #1a1a1a);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -32px;
            margin-left: -32px;
            box-shadow: 
                0 10px 15px rgba(0,0,0,0.9),
                inset 0 2px 5px rgba(255,255,255,0.3);
            border: 1px solid #444;
            pointer-events: none;
            transition: transform 0.15s ease-out;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>2048</h1>
        <div class="score-container">
            <div class="score-board">
                <div class="score-label">Score</div>
                <span id="score">0</span>
            </div>
            <div class="score-board">
                <div class="score-label">Best</div>
                <span id="best-score">0</span>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <div id="grid-container"></div>
        <canvas id="sparks-canvas" width="420" height="420"></canvas>
        
        <!-- Game Over Overlay -->
        <div id="game-over-overlay">
            <h2 class="bloody-text">GAME<br>OVER</h2>
            <button id="restart-btn">Restart</button>
        </div>
    </div>

    <!-- Virtual Joystick -->
    <div id="joystick-container">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('best-score');
        const canvas = document.getElementById('sparks-canvas');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const restartBtn = document.getElementById('restart-btn');
        const ctx = canvas.getContext('2d');
        
        let board = [];
        let score = 0;
        let bestScore = localStorage.getItem('2048-best-score') || 0; 
        bestScoreElement.textContent = bestScore;
        let tileIdCounter = 0;
        let isGameOver = false;

        const size = 4;
        const cellSize = 90;
        const gap = 10;

        const colors = {
            2: '#3498db',
            4: '#9b59b6',
            8: '#e74c3c',
            16: '#f1c40f',
            32: '#2ecc71',
            64: '#e67e22',
            128: '#1abc9c',
            256: '#ff007f',
            512: '#00ffcc',
            1024: '#ffcc00',
            2048: '#ffffff'
        };

        function initGame() {
            board = Array(size).fill().map(() => Array(size).fill(null));
            gridContainer.innerHTML = '';
            gameOverOverlay.classList.remove('show');
            isGameOver = false;
            
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.style.top = `${gap + r * (cellSize + gap)}px`;
                    cell.style.left = `${gap + c * (cellSize + gap)}px`;
                    gridContainer.appendChild(cell);
                }
            }

            score = 0;
            updateScore();
            addRandomTile();
            addRandomTile();
        }

        function getPosition(row, col) {
            return {
                top: gap + row * (cellSize + gap),
                left: gap + col * (cellSize + gap)
            };
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!board[r][c]) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length === 0) return;

            const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            createTile(r, c, value);
        }

        function createTile(r, c, value, isMerged = false) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            if (isMerged) tile.classList.add('tile-merged');
            else tile.classList.add('tile-new');

            const id = `tile-${tileIdCounter++}`;
            tile.id = id;
            updateTileDOM(tile, r, c, value);
            gridContainer.appendChild(tile);

            board[r][c] = { id, value, element: tile };
        }

        function updateTileDOM(element, r, c, value) {
            const pos = getPosition(r, c);
            element.style.top = `${pos.top}px`;
            element.style.left = `${pos.left}px`;
            element.textContent = value;
            element.style.backgroundColor = colors[value] || '#ff00ff';
            
            if (value >= 1024) {
                element.style.boxShadow = `0 0 20px ${colors[value]}, inset 0 2px 4px rgba(255,255,255,0.6)`;
                element.style.color = '#000';
            }
        }

        function updateScore() {
            scoreElement.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.textContent = bestScore;
                localStorage.setItem('2048-best-score', bestScore);
            }
        }

        function checkGameOver() {
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!board[r][c]) return false; 
                }
            }
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let currentVal = board[r][c].value;
                    if (r < size - 1 && board[r + 1][c] && board[r + 1][c].value === currentVal) return false;
                    if (c < size - 1 && board[r][c + 1] && board[r][c + 1].value === currentVal) return false;
                }
            }
            return true; 
        }

        // Sparks Particle System
        let particles = [];
        
        function createExplosion(r, c, color) {
            const pos = getPosition(r, c);
            const x = pos.left + cellSize / 2;
            const y = pos.top + cellSize / 2;

            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0, color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; 
                p.life -= 0.02; 

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function move(direction) {
            if (isGameOver) return;
            let moved = false;

            for (let i = 0; i < size; i++) {
                let line = [];
                for (let j = 0; j < size; j++) {
                    let r = direction === 'up' || direction === 'down' ? j : i;
                    let c = direction === 'left' || direction === 'right' ? j : i;
                    if (board[r][c]) line.push({...board[r][c], r, c});
                }

                if (direction === 'right' || direction === 'down') line.reverse();

                let newLine = [];
                let skipNext = false;
                for (let k = 0; k < line.length; k++) {
                    if (skipNext) { skipNext = false; continue; }
                    
                    if (k < line.length - 1 && line[k].value === line[k+1].value) {
                        newLine.push({
                            value: line[k].value * 2,
                            elementsToDestroy: [line[k], line[k+1]],
                            merged: true
                        });
                        score += line[k].value * 2;
                        skipNext = true;
                    } else {
                        newLine.push(line[k]);
                    }
                }

                while(newLine.length < size) newLine.push(null);
                if (direction === 'right' || direction === 'down') newLine.reverse();

                for (let j = 0; j < size; j++) {
                    let r = direction === 'up' || direction === 'down' ? j : i;
                    let c = direction === 'left' || direction === 'right' ? j : i;
                    const target = newLine[j];

                    if (target === null) {
                        board[r][c] = null;
                        continue;
                    }

                    if (target.merged) {
                        moved = true;
                        board[r][c] = null;
                        target.elementsToDestroy.forEach(t => {
                            updateTileDOM(t.element, r, c, t.value);
                            setTimeout(() => t.element.remove(), 150);
                        });
                        
                        setTimeout(() => {
                            createTile(r, c, target.value, true);
                            createExplosion(r, c, colors[target.value] || '#fff');
                        }, 150);
                    } else if (target.r !== r || target.c !== c) {
                        moved = true;
                        updateTileDOM(target.element, r, c, target.value);
                        board[r][c] = { id: target.id, value: target.value, element: target.element };
                    } else {
                        board[r][c] = target; 
                    }
                }
            }

            if (moved) {
                updateScore();
                setTimeout(() => {
                    addRandomTile();
                    if (checkGameOver()) {
                        isGameOver = true;
                        gameOverOverlay.classList.add('show');
                    }
                }, 200);
            }
        }

        // Restart Button Click
        restartBtn.addEventListener('click', initGame);

        // --- JOYSTICK LOGIC ---
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        
        let isDragging = false;
        let joystickMoved = false; 
        
        const maxRadius = 45;      // How far the stick can visually travel
        const triggerRadius = 30;  // How far you must drag to trigger a move
        const resetRadius = 15;    // Stick must return inside this radius to allow the next move
        
        let centerX, centerY;

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function handleStart(e) {
            if(e.target === restartBtn) return;
            isDragging = true;
            joystickMoved = false;
            joystickStick.style.transition = 'none'; // Disable snapping animation while dragging
            
            const rect = joystickBase.getBoundingClientRect();
            centerX = rect.left + rect.width / 2;
            centerY = rect.top + rect.height / 2;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling while using joystick

            const pos = getEventPos(e);
            let dx = pos.x - centerX;
            let dy = pos.y - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);
            
            // Constrain visual stick to the base
            if (distance > maxRadius) {
                const ratio = maxRadius / distance;
                dx *= ratio;
                dy *= ratio;
                distance = maxRadius;
            }
            
            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;

            // Allow a new move if they return the stick near the center
            if (distance < resetRadius) {
                joystickMoved = false; 
            }

            // Trigger move if pushed far enough
            if (distance > triggerRadius && !joystickMoved) {
                joystickMoved = true;
                
                // Determine direction based on angle
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                
                if (angle > -45 && angle <= 45) {
                    move('right');
                } else if (angle > 45 && angle <= 135) {
                    move('down');
                } else if (angle > 135 || angle <= -135) {
                    move('left');
                } else {
                    move('up');
                }
            }
        }

        function handleEnd() {
            if (!isDragging) return;
            isDragging = false;
            joystickMoved = false;
            
            // Snap back to center
            joystickStick.style.transition = 'transform 0.15s ease-out';
            joystickStick.style.transform = `translate(0px, 0px)`;
        }

        // Attach Joystick Listeners
        joystickBase.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove, { passive: false });
        window.addEventListener('mouseup', handleEnd);

        joystickBase.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd);

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) {
                e.preventDefault(); 
            }
            switch (e.key) {
                case 'ArrowUp': move('up'); break;
                case 'ArrowDown': move('down'); break;
                case 'ArrowLeft': move('left'); break;
                case 'ArrowRight': move('right'); break;
            }
        });

        initGame();
    </script>
</body>
</html>
