<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 2048 with Sparks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Kills pull-to-refresh and browser history edge-swiping */
            overscroll-behavior: none; 
            /* Disables all native browser touch gestures */
            touch-action: none; 
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
            perspective: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            transform: translateZ(50px);
        }

        h1 {
            margin: 0;
            font-size: 48px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .score-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .score-board {
            background: #222;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 20px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
            border: 1px solid #333;
            min-width: 100px;
        }

        .score-board span {
            font-size: 24px;
            display: block;
            color: #fff;
        }

        .score-label {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #game-wrapper {
            position: relative;
            transform: rotateX(15deg) rotateZ(0deg);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
            user-select: none; 
        }

        #game-wrapper:active {
            cursor: grabbing;
        }

        #grid-container {
            width: 420px;
            height: 420px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 12px;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.9), 
                inset 0 2px 10px rgba(255,255,255,0.05),
                0 0 20px rgba(255,255,255,0.05);
            border: 1px solid #333;
            transform-style: preserve-3d;
        }

        .grid-cell {
            width: 90px;
            height: 90px;
            background: #111;
            border-radius: 8px;
            position: absolute;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
            border: 1px solid #222;
        }

        .tile {
            width: 90px;
            height: 90px;
            position: absolute;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            transform: translateZ(10px);
            transition: top 0.15s ease-in-out, left 0.15s ease-in-out, transform 0.15s;
            box-shadow: 
                0 8px 15px rgba(0,0,0,0.6), 
                inset 0 2px 4px rgba(255,255,255,0.4);
            text-shadow: 1px 2px 4px rgba(0,0,0,0.4);
        }

        .tile-merged {
            animation: pop 0.3s ease-out;
        }
        .tile-new {
            animation: appear 0.3s ease-out;
        }

        @keyframes pop {
            0% { transform: translateZ(10px) scale(1); }
            50% { transform: translateZ(30px) scale(1.15); }
            100% { transform: translateZ(10px) scale(1); }
        }

        @keyframes appear {
            0% { transform: translateZ(0px) scale(0); opacity: 0; }
            100% { transform: translateZ(10px) scale(1); opacity: 1; }
        }

        #sparks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            transform: translateZ(40px);
        }

        /* --- GAME OVER UI STYLES --- */
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            transform: translateZ(60px); /* Float above the game */
        }

        #game-over-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .bloody-text {
            font-size: 56px;
            color: #ff0000;
            margin: 0 0 30px 0;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            /* Bloody, glowing, dripping text shadow effect */
            text-shadow: 
                2px 2px 0px #660000, 
                -2px -2px 0px #660000,
                0 0 20px #ff0000,
                0 15px 10px rgba(255, 0, 0, 0.9),
                0 25px 25px rgba(255, 0, 0, 0.7);
            animation: pulse-blood 1.5s infinite alternate;
        }

        @keyframes pulse-blood {
            from { 
                text-shadow: 0 0 10px #ff0000, 0 15px 10px rgba(255, 0, 0, 0.9); 
                transform: scale(1); 
            }
            to { 
                text-shadow: 0 0 30px #ff0000, 0 25px 25px rgba(255, 0, 0, 0.7); 
                transform: scale(1.08); 
            }
        }

        #restart-btn {
            background: #8a0000;
            color: white;
            border: 1px solid #ff0000;
            padding: 15px 35px;
            font-size: 22px;
            font-family: 'Poppins', sans-serif;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.2);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #restart-btn:hover {
            background: #ff0000;
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(255,0,0,0.8);
        }
    </style>
</head>

        <div class="score-container">

                <div class="score-label">Score</div>
                <span id="score">0</span>
            </div>
            <div class="score-board">

                <span id="best-score">0</span>
            </div>

            <Here is how you can implement game over detection (checking for no available moves) and a centered, animated "bloody" Game Over overlay that prompts the player to restart. 

### 1. Game Over Detection Logic
Assuming your game is grid-based (like 2048, Threes, or a matching game), a "Game Over" happens when the board is completely full **and** there are no adjacent matching tiles that can be combined.

Add this function to your JavaScript:

```javascript
function hasAvailableMoves(board) {
  const rows = board.length;
  const cols = board[0].length;

  // 1. Check for any empty spaces (assuming 0 means empty)
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === 0) {
        return true; // Still have space to move
      }
    }
  }

  // 2. Check for adjacent matching tiles (horizontal and vertical)
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let currentTile = board[r][c];
      
      // Check tile below
      if (r < rows - 1 && currentTile === board[r + 1][c]) {
        return true;
      }
      // Check tile to the right
      if (c < cols - 1 && currentTile === board[r][c + 1]) {
        return true;
      }
    }
  }

  // No empty spaces and no adjacent matches
  return false; 
}

// Call this after every player move:
function afterMove(board) {
  if (!hasAvailableMoves(board)) {
    triggerGameOver();
  }
}
